server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # "^~" (pas juste "/api/") : sans ce modificateur, un préfixe simple est TOUJOURS
    # moins prioritaire que les locations regex (~*) plus bas dans ce fichier, quel que soit
    # l'ordre d'écriture. Résultat observé en prod : /api/v1/layers/icons/xxx.svg matchait la
    # regex "\.svg$" de mise en cache statique (ligne ~29) au lieu d'être relayé vers l'API -
    # nginx cherchait alors un fichier .svg inexistant sur son propre disque -> 404 generique,
    # jamais transmis a Fastify. "^~" force ce prefixe a gagner des qu'il correspond, sans
    # meme evaluer les regles regex ensuite.
    location ^~ /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sans ça, la limite par défaut de nginx (1m) rejette en 413 tout import de raster
        # (GeoTIFF/orthophoto/MNT, largement > 1MB) avant même que la requête n'atteigne
        # Fastify - garder cohérent avec la limite fileSize de multipart.plugin.ts (backend)
        # et Timeout/ProxyTimeout du vhost Apache (reverse proxy système en amont).
        client_max_body_size 2g;
        # gdalwarp + gdaladdo + raster2pgsql (voir raster.service.ts) peuvent dépasser
        # largement le défaut de 60s sur un gros raster - la requête reste ouverte tout ce
        # temps (pas de traitement asynchrone côté import raster), d'où un délai généreux.
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    # Centre de notifications (voir NotificationService.registerRoutes()) - route brute
    # `GET /ws/notifications`, PAS sous /api/v1, d'où un bloc séparé du proxy /api/ ci-dessus.
    # Sans les en-têtes Upgrade/Connection, nginx traite la requête comme du HTTP classique et
    # ne relaie jamais le handshake WebSocket - le navigateur voit alors l'échec de connexion
    # sans jamais atteindre Fastify (bug réel observé en prod : notifications/tiroir de tâches
    # toujours vides malgré des jobs qui se terminent normalement côté serveur).
    location ^~ /ws/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Une connexion WebSocket reste ouverte indéfiniment (pas une requête HTTP ponctuelle) -
        # le timeout de lecture HTTP classique (60s par défaut) la couperait sinon en plein
        # usage normal.
        proxy_read_timeout 3600s;
    }

    location ^~ /ows {
        proxy_pass http://qgis-server:8080/ows;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
}
