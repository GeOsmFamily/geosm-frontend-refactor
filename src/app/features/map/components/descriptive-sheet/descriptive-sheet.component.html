<h2 mat-dialog-title>
  <mat-icon>info</mat-icon>
  {{ data.layerName || 'Fiche descriptive' }}
</h2>
<mat-dialog-content>
  <div class="sheet-content">
    <!-- External links -->
    @if (wikipediaUrl || wikidataUrl || osmUrl) {
      <div class="external-links">
        @if (wikipediaUrl) {
          <button mat-stroked-button (click)="openExternal(wikipediaUrl!)">
            <img
              src="assets/icones/descriptive-sheet/wikipedia-logo.svg"
              alt="Wikipedia"
              class="link-icon"
            />
            Wikipedia
          </button>
        }
        @if (wikidataUrl) {
          <button mat-stroked-button (click)="openExternal(wikidataUrl!)">
            <img
              src="assets/icones/descriptive-sheet/wikidata-logo.svg"
              alt="Wikidata"
              class="link-icon"
            />
            Wikidata
          </button>
        }
        @if (osmUrl) {
          <button mat-stroked-button (click)="openExternal(osmUrl!)">
            <img src="assets/icones/descriptive-sheet/Logo_mono.svg" alt="OSM" class="link-icon" />
            OpenStreetMap
          </button>
        }
      </div>

      <mat-divider></mat-divider>
    }

    <!-- Properties table -->
    <table class="properties-table">
      @for (prop of properties; track prop.key) {
        <tr>
          <td class="prop-key">{{ prop.key }}</td>
          <td class="prop-value">{{ prop.value }}</td>
        </tr>
      }
    </table>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Fermer</button>
</mat-dialog-actions>
